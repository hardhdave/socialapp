{% extends "base.html" %} {% block title %}Set New Password - Sapp{% endblock %}
{% block content %}
<div class="form-container">
  <h2 class="text-center mb-3">Set a new password</h2>
  <form method="POST">
    <div class="form-group">
      <label for="password" class="form-label">New Password</label>
      <div class="d-flex align-center" style="gap: 0.5rem">
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          required
          style="flex: 1"
        />
        <button type="button" class="btn btn-secondary" id="toggle-password">
          Show
        </button>
      </div>
    </div>
    <div class="form-group">
      <label for="confirm_password" class="form-label">Confirm Password</label>
      <div class="d-flex align-center" style="gap: 0.5rem">
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          class="form-input"
          required
          style="flex: 1"
        />
        <button type="button" class="btn btn-secondary" id="toggle-confirm">
          Show
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%">
      Update Password
    </button>
  </form>
</div>
{% endblock %} {% block scripts %}
<script>
  (function () {
    function toggleButton(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (btn && input) {
        btn.addEventListener("click", function () {
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          btn.textContent = isPassword ? "Hide" : "Show";
        });
      }
    }
    toggleButton("toggle-password", "password");
    toggleButton("toggle-confirm", "confirm_password");
  })();
  </script>
{% endblock %}
